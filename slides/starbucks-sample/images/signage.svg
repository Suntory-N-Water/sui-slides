<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="店内サイネージ表示案">
  <rect width="480" height="360" fill="#1E3932"/>
  <text x="32" y="52" fill="#ffffff" font-family="Inter, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">PICKUP</text>
  <text x="448" y="52" fill="rgba(255,255,255,0.7)" font-family="Inter, Helvetica, sans-serif" font-size="14" text-anchor="end">08:14</text>

  <g font-family="Inter, Helvetica, sans-serif">
    <g stroke="rgba(255,255,255,0.16)" stroke-width="1">
      <line x1="32" y1="80" x2="448" y2="80"/>
      <line x1="32" y1="140" x2="448" y2="140"/>
      <line x1="32" y1="200" x2="448" y2="200"/>
      <line x1="32" y1="260" x2="448" y2="260"/>
      <line x1="32" y1="320" x2="448" y2="320"/>
    </g>

    <!-- 直近に完成した行は塗りではなく左の縦バーで示す -->
    <rect x="32" y="88" width="3" height="44" fill="#d4e9e2"/>
    <text x="52" y="116" fill="#ffffff" font-size="22" font-weight="700">LANE 1</text>
    <text x="180" y="116" fill="#ffffff" font-size="22">N・831</text>
    <text x="448" y="116" fill="#ffffff" font-size="15" text-anchor="end">READY</text>

    <text x="52" y="176" fill="#ffffff" font-size="22" font-weight="700">LANE 2</text>
    <text x="180" y="176" fill="#ffffff" font-size="22">S・412</text>
    <text x="448" y="176" fill="rgba(255,255,255,0.7)" font-size="15" text-anchor="end">READY</text>

    <text x="52" y="236" fill="#ffffff" font-size="22" font-weight="700">LANE 2</text>
    <text x="180" y="236" fill="#ffffff" font-size="22">K・207</text>
    <text x="448" y="236" fill="rgba(255,255,255,0.7)" font-size="15" text-anchor="end">READY</text>

    <text x="52" y="296" fill="rgba(255,255,255,0.5)" font-size="22" font-weight="700">LANE 3</text>
    <text x="180" y="296" fill="rgba(255,255,255,0.5)" font-size="22">T・559</text>
    <text x="448" y="296" fill="#cba258" font-size="15" text-anchor="end">MAKING</text>
